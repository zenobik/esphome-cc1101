# XIAO ESP32C3 + CC1101 (868 MHz): Sagemcom XT211 + Techem vario 4 / radio 4.
#
# CC1101 -> XIAO ESP32C3
#   GND -> GND, VCC -> 3V3 (nie 5V), GDO0 -> D1, CSN -> D2,
#   SCK -> D3, MOSI -> D4, MISO/GDO1 -> D5, GDO2 -> niepodlaczony

substitutions:
  name: wmbus-xiao
  friendly_name: Liczniki wM-Bus

  # ID licznikow (8 cyfr, jak w ramkach). 00000000 = brak licznika.
  xt211_id: "00000000"
  techem_id: "00000000"
  water_id: "00000000"

  freq_xt211: "868300000"
  freq_techem: "868950000"
  techem_interval: 60min
  techem_window: 300s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 30s
      - script.execute: techem_window

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 5min
  ap:
    ssid: ${friendly_name}
    password: !secret ap_password

captive_portal:

external_components:
  - source: github://zenobik/esphome-cc1101@main
    components: [wmbus_radio, wmbus_common, wmbus_meter]

spi:
  clk_pin: GPIO5   # D3
  mosi_pin: GPIO6  # D4
  miso_pin: GPIO7  # D5

wmbus_radio:
  id: wmbus_rx
  radio_type: CC1101
  cs_pin: GPIO4    # D2
  irq_pin: GPIO3   # D1
  frequency: 868.3MHz
  on_frame:
    - then:
        - lambda: |-
            // Techem vario 4.5.1 (TCH 17/C3, CI A2, bez szyfrowania):
            // poprzedni okres = bajty 3-4, biezacy = 7-8 po CI, w MJ.
            auto &d = frame->data();
            if (d.size() < 20 || d[2] != 0x68 || d[3] != 0x50)
              return;
            uint32_t rx_id = d[4] | (d[5] << 8) | (d[6] << 16) | ((uint32_t) d[7] << 24);
            if (rx_id != 0x${techem_id})
              return;
            frame->mark_as_handled();
            if (d[8] != 0x17 || d[9] != 0xC3 || d[10] != 0xA2)
              return;
            const uint8_t *p = &d[11];
            uint16_t prev = p[3] | (p[4] << 8);
            uint16_t curr = p[7] | (p[8] << 8);
            id(techem_previous).publish_state(prev / 1000.0f);
            id(techem_current).publish_state(curr / 1000.0f);
            id(techem_sum).publish_state((prev + curr) / 1000.0f);
            id(techem_rssi).publish_state(frame->rssi());
            id(heat_ok) = true;
            id(techem_done).execute();

wmbus_meter:
  - id: xt211
    meter_id: 0x${xt211_id}
    type: amiplus
    key: !secret xt211_key
    mode:
      - T1

  - id: water
    meter_id: 0x${water_id}
    type: mkradio4
    mode:
      - T1
    on_telegram:
      - lambda: id(water_ok) = true;
      - script.execute: techem_done

globals:
  - id: heat_ok
    type: bool
    initial_value: "false"
  - id: water_ok
    type: bool
    initial_value: "false"

script:
  # Okno odbioru Techem na 868,95 MHz; konczy sie po ramkach albo po techem_window.
  - id: techem_window
    mode: single
    then:
      - lambda: |-
          id(heat_ok) = (0x${techem_id} == 0);
          id(water_ok) = (0x${water_id} == 0);
          id(wmbus_rx).set_frequency(${freq_techem});
      - delay: ${techem_window}
      - lambda: id(wmbus_rx).set_frequency(${freq_xt211});

  - id: techem_done
    mode: single
    then:
      - if:
          condition:
            lambda: return id(heat_ok) && id(water_ok) && id(techem_window).is_running();
          then:
            - script.stop: techem_window
            - lambda: id(wmbus_rx).set_frequency(${freq_xt211});

interval:
  - interval: ${techem_interval}
    then:
      - script.execute: techem_window

sensor:
  - platform: wmbus_meter
    parent_id: xt211
    field: total_energy_consumption_kwh
    name: "Prad energia pobrana"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: xt211
    field: total_energy_production_kwh
    name: "Prad energia oddana"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: xt211
    field: current_power_consumption_kw
    name: "Prad moc pobierana"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 1000

  - platform: wmbus_meter
    parent_id: xt211
    field: current_power_production_kw
    name: "Prad moc oddawana"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 1000

  - platform: wmbus_meter
    parent_id: xt211
    field: rssi_dbm
    name: "Prad RSSI"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: wmbus_meter
    parent_id: water
    field: total_m3
    name: "Woda zuzycie"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: water
    field: target_m3
    name: "Woda na koniec poprzedniego okresu"
    unit_of_measurement: "m³"
    device_class: water
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: water
    field: rssi_dbm
    name: "Woda RSSI"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    id: techem_current
    name: "Cieplo biezacy okres"
    unit_of_measurement: "GJ"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: template
    id: techem_previous
    name: "Cieplo poprzedni okres"
    unit_of_measurement: "GJ"
    device_class: energy
    accuracy_decimals: 3

  - platform: template
    id: techem_sum
    name: "Cieplo suma okresow"
    unit_of_measurement: "GJ"
    device_class: energy
    accuracy_decimals: 3

  - platform: template
    id: techem_rssi
    name: "Cieplo RSSI"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "Czestotliwosc odbiornika"
    unit_of_measurement: "MHz"
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 10s
    lambda: return id(wmbus_rx).get_frequency() / 1e6f;

  - platform: wifi_signal
    name: "WiFi sygnal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Czas pracy"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: template
    name: "Odczytaj Techem teraz"
    on_press:
      - script.execute: techem_window

  - platform: restart
    name: "Restart"
    entity_category: diagnostic
